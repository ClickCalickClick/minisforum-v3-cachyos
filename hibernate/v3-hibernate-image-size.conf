# Minisforum V3: aim for a 6 GiB hibernation image instead of the default
# 2/5 of RAM (~10 GiB). The snapshot needs free RAM for a copy of everything
# it saves, and amdgpu allocates another 1-3.5 GiB after the kernel has made
# room (it backs up the VRAM carve-out while devices suspend). With the
# default target that pushed it over: "PM: hibernation: Error -12 creating
# image". This is a soft target; the kernel saves more if it can't shrink
# that far.
w /sys/power/image_size - - - - 6442450944
